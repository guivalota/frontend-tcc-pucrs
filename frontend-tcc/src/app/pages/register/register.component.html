<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow" style="min-width: 300px; max-width: 400px; width: 100%;">
    <h4 class="text-center mb-4">Registro</h4>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input id="email" name="email" class="form-control" formControlName="email" type="email" required>
      </div>

      <div class="mb-3">
        <label for="login" class="form-label">Login</label>
        <input id="login" name="login" class="form-control" formControlName="login" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Senha</label>
        <input id="password" name="password" class="form-control" formControlName="password" type="password" required>
      </div>
      <button class="btn btn-primary w-100" type="submit" [disabled]="registerForm.invalid">Registrar</button>

      <div class="text-center mt-3">
        <a routerLink="/login">Voltar ao Login</a>
      </div>
    </form>
    <p *ngIf="errorMessage">{{ errorMessage }}</p>
    <p *ngIf="successMessage">{{ successMessage }}</p>
  </div>
</div>
