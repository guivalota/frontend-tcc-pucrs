<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow" style="min-width: 300px; max-width: 400px; width: 100%;">
    <h4 class="text-center mb-4">Recuperar Senha</h4>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="login" class="form-label">Login</label>
        <input id="login" name="login" class="form-control" formControlName="login" required>
      </div>

      <button class="btn btn-primary w-100" type="submit" [disabled]="form.invalid">Recuperar senha</button>

      <div class="text-center mt-3">
        <a routerLink="/login">Voltar ao Login</a>
      </div>
    </form>
    <p *ngIf="message" style="color: green">{{ message }}</p>
    <p *ngIf="error" style="color: red">{{ error }}</p>
  </div>
</div>
