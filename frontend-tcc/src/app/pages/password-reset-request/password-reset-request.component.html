<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="container-personalizado card p-4 shadow" style="min-width: 300px; max-width: 400px; width: 100%;">
    <h4 class="text-center mb-4">Recuperar Senha</h4>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <input id="login" name="login" class="" formControlName="login" placeholder="LOGIN" required>
      </div>
      <div class="text-center mt-3">
        <a routerLink="/login">VOLTAR AO LOGIN</a>
      </div>
      <div class="d-flex justify-content-center mt-4">
        <button class="btn btn-personalizado" type="submit" [disabled]="form.invalid">
          Recuperar senha
        </button>
      </div>
      
    </form>
    <p *ngIf="message" style="color: green">{{ message }}</p>
    <p *ngIf="error" style="color: red">{{ error }}</p>
  </div>
</div>
