<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow" style="min-width: 300px; max-width: 400px; width: 100%;">
    <h4 class="text-center mb-4">Login</h4>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="login" class="form-label">Login</label>
        <input id="login" name="login" class="form-control" formControlName="login"  required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Senha</label>
        <input id="password" name="password" type="password" class="form-control" formControlName="password" required>
      </div>

      <button class="btn btn-primary w-100" type="submit" [disabled]="loginForm.invalid">Entrar</button>

      <div class="text-center mt-3">
        <a routerLink="/reset-password">Esqueceu a senha?</a><br>
        <a routerLink="/register">Criar uma conta</a>
      </div>
    </form>
    <p *ngIf="errorMessage">{{ errorMessage }}</p>
  </div>
</div>
